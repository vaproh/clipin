version: "2"
sql:
  - schema: "migrations/*.up.sql"
    engine: "postgresql"
    queries: "query.sql"
    gen:
      go:
        package: "db"
        out: "../internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
