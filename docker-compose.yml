services:
  postgres:
    image: postgres:16-alpine
    container_name: clipin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipin_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-clipin_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipin} -d ${POSTGRES_DB:-clipin_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clipin-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: clipin_postgres_data
  redis_data:
    name: clipin_redis_data
